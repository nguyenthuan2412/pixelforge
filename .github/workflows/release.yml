name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write

jobs:
  pecl-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build PECL package
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker run --rm -v "$PWD":/src -w /src php:8.5-cli \
            sh -c "php scripts/package.php $version && pecl package package.xml"
          ls -la pixelforge-$version.tgz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "pixelforge $version" --notes-file CHANGELOG.md --verify-tag
          gh release upload "$GITHUB_REF_NAME" "pixelforge-$version.tgz" package.xml --clobber
      - name: Verify the README install steps against this release
        env:
          GH_TOKEN: ${{ github.token }}
        # releases created with GITHUB_TOKEN don't trigger other workflows, so dispatch it explicitly
        run: gh workflow run "README install" --repo "$GITHUB_REPOSITORY" --ref main
